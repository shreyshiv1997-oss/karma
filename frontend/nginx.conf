# The reverse proxy that makes the app's same-origin assumption true in production.
#
# In dev, Vite does this (see vite.config.ts). In production this file does it. The two must
# agree, because the frontend hard-codes a relative base of `/api/v1` and derives its
# WebSocket URL from `window.location.host` -- it never learns where the API actually lives.

server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip the bundle. The whole JS payload is ~60 kB gzipped versus ~199 kB raw, and this is
    # the difference on a slow mobile connection -- the "faster than either original" claim is
    # about the user's experience, not the build output.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed filenames from Vite are content-addressed, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The API. `proxy_http_version 1.1` plus the two Upgrade headers are what let the
    # WebSocket handshake through -- without them nginx proxies the upgrade as plain HTTP and
    # the socket never opens, exactly the failure `ws: true` prevents in the Vite proxy.
    location /api/ {
        # API image objects are capped at 5 MiB. Leave room for multipart
        # framing while still rejecting unexpectedly large bodies at the edge.
        client_max_body_size 6m;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long reads on the socket. The default 60s would close an idle connection between the
        # app's own 25s heartbeats only under pathological delay, but the margin is free.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback: any unmatched path is a client-side route, not a missing file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
